<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Balatrodex</title>
<style>
:root{
  --felt:#1d4734; --felt-dark:#143226; --ink:#21201d;
  --card:#f8f3e3; --card-edge:#2b2a26;
  --chip:#0098ff; --mult:#fe5f55; --gold:#f2c14e;
  --common:#0093ff; --uncommon:#35bd86; --rare:#ff4c40; --legendary:#aa5ab4;
  --tarot:#a78bfa; --planet:#5fd3e8; --spectral:#7ec8ff;
  --text-dim:#bcd4c6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,"SF Pro Rounded",ui-rounded,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(ellipse at 50% -10%, #2c6a4e 0%, var(--felt) 45%, var(--felt-dark) 100%) fixed,
    var(--felt);
  color:#f3efe2;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg, rgba(15,36,27,.97) 0%, rgba(15,36,27,.92) 100%);
  border-bottom:3px solid #0b1d15;
  backdrop-filter:blur(6px);
  transition:transform .28s ease;
}
header.nav-hidden{transform:translateY(-100%)}
/* ---------- top nav (dropdown menus) ---------- */
.topnav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  margin-top:10px;padding-top:9px;border-top:2px solid rgba(255,255,255,.08)}
.tnitem{position:relative}
.tnbtn{
  background:rgba(255,255,255,.07);color:#f3efe2;border:2px solid rgba(0,0,0,.3);
  border-radius:9px;padding:7px 12px;font-size:13px;font-weight:800;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;gap:5px;transition:background .15s,color .15s,border-color .15s;
}
.tnbtn:hover,.tnbtn.on{background:var(--gold);color:#211a05;border-color:#8a6a14}
.tnbtn .car{font-size:10px;opacity:.85}
.tndrop{
  position:absolute;top:calc(100% + 7px);left:50%;
  min-width:166px;max-height:64vh;overflow-y:auto;
  background:var(--card);border:3px solid var(--card-edge);border-radius:12px;
  box-shadow:0 8px 0 rgba(0,0,0,.35);padding:6px;z-index:70;
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateX(-50%) translateY(-7px);
  transition:opacity .18s ease,transform .18s ease,visibility .18s;
}
.tnitem:hover .tndrop{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.tndrop a{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 11px;border-radius:8px;color:var(--ink);font-size:13px;font-weight:700;
  white-space:nowrap;cursor:pointer;position:relative}
.tndrop a:hover{background:rgba(0,0,0,.08)}
.tndrop a .car{font-size:11px;opacity:.6}
.tnsub{
  position:absolute;top:-3px;left:calc(100% + 5px);
  min-width:140px;background:var(--card);border:3px solid var(--card-edge);border-radius:12px;
  box-shadow:0 8px 0 rgba(0,0,0,.35);padding:6px;z-index:80;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-6px);
  transition:opacity .15s ease,transform .15s ease,visibility .15s;
}
.hassub:hover .tnsub{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.topnav.suppress .tndrop,.topnav.suppress .tnsub{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.brand h1{
  font-size:22px;font-weight:900;letter-spacing:.5px;
  color:var(--gold);text-shadow:0 2px 0 #000;
}
.brand span{font-size:11px;color:var(--text-dim);font-weight:600}
.searchrow{display:flex;gap:8px}
.searchrow input{
  flex:1;height:40px;border-radius:10px;border:3px solid var(--card-edge);
  background:var(--card);color:var(--ink);font-size:16px;font-weight:600;
  padding:0 12px;outline:none;box-shadow:0 3px 0 rgba(0,0,0,.45);
}
.searchrow input::placeholder{color:#8a8674}
/* filter chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{
  flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;
  border:2.5px solid var(--card-edge);background:#0f241b;color:var(--text-dim);
  box-shadow:0 2px 0 rgba(0,0,0,.4);cursor:pointer;user-select:none;
}
.fchip.on{background:var(--gold);color:#211a05;border-color:#7a5c12}
.fchip.r-common.on{background:var(--common);color:#fff;border-color:#005a9e}
.fchip.r-uncommon.on{background:var(--uncommon);color:#06281b;border-color:#1a6e4c}
.fchip.r-rare.on{background:var(--rare);color:#fff;border-color:#8f1d14}
.fchip.r-legendary.on{background:var(--legendary);color:#fff;border-color:#5e2a66}
/* ---------- card grid ---------- */
main{padding:12px 12px 24px}
.count{font-size:11px;font-weight:700;color:var(--text-dim);margin:2px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.bcard{
  background:var(--card);border:3px solid var(--card-edge);border-radius:12px;
  box-shadow:0 4px 0 rgba(0,0,0,.45);
  padding:8px 7px 7px;display:flex;flex-direction:column;gap:6px;
  cursor:pointer;transition:transform .08s ease;
  min-height:118px;position:relative;overflow:hidden;
}
.bcard:active{transform:translateY(2px) rotate(-1deg);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.bcard .art{
  aspect-ratio:71/95;width:100%;border-radius:7px;position:relative;overflow:hidden;
}
.bcard .art img,.dart img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  image-rendering:pixelated;border-radius:inherit;
}
/* placeholder box (tint + glyph): hidden by default, shown only if the image fails to load */
.art .ph,.dart .ph{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  border-radius:inherit;color:#fff;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.4);letter-spacing:1px;
}
.art .ph{font-size:20px;border:2px solid rgba(0,0,0,.25)}
.dart .ph{font-size:26px;border:2.5px solid rgba(0,0,0,.3)}
.art.noimg .ph,.dart.noimg .ph{display:flex}
.bcard .nm{font-size:11.5px;font-weight:800;color:var(--ink);line-height:1.15}
.bcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.rdot{width:9px;height:9px;border-radius:3px;border:1.5px solid rgba(0,0,0,.35)}
.cost{font-size:11px;font-weight:900;color:#9b7b16}
/* glyph art */
.art .gl,.dart .gl{font-size:30px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.dart .gl{font-size:40px}
.planetball{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.3);
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.85), var(--pc) 55%, rgba(0,0,0,.35));
  position:relative}
.dart .planetball{width:48px;height:48px}
.planetball.ring::after{content:'';position:absolute;left:-9px;right:-9px;top:42%;height:8px;
  border:2px solid rgba(0,0,0,.45);border-radius:50%;background:rgba(255,255,255,.35);transform:rotate(-18deg)}
.t-tag{background:linear-gradient(160deg,#6aa8e8,#2f5fa8)}
/* rarity art tints */
.t-common{background:linear-gradient(160deg,#33a7ff,#0070cc)}
.t-uncommon{background:linear-gradient(160deg,#46d49a,#1f8a5e)}
.t-rare{background:linear-gradient(160deg,#ff6a5e,#cc2e22)}
.t-legendary{background:linear-gradient(160deg,#c178cb,#7e3b88)}
.t-tarot{background:linear-gradient(160deg,#b9a0fc,#7c5cd6)}
.t-planet{background:linear-gradient(160deg,#7fe0f2,#2f9cb4)}
.t-spectral{background:linear-gradient(160deg,#9fd4ff,#3f7fc4)}
.t-deck{background:linear-gradient(160deg,#f0c95c,#b88a1e)}
.t-seal{background:linear-gradient(160deg,#e88aa0,#c23a5c)}
.t-stake{background:linear-gradient(160deg,#e57368,#b02a1d)}
.t-sticker{background:linear-gradient(160deg,#b8c0c2,#7f8c8d)}
.t-enh{background:linear-gradient(160deg,#7fd3a3,#3f9e6e)}
.t-voucher{background:linear-gradient(160deg,#e6c66a,#b8902a)}
.t-blind{background:linear-gradient(160deg,#b07ad0,#6f2f9e)}
.t-pack{background:linear-gradient(160deg,#f0a35c,#c2641e)}
/* ---------- detail modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;background:rgba(8,20,15,.78);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.overlay.show{display:flex}
.sheet{
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  background:var(--card);color:var(--ink);
  border:3px solid var(--card-edge);
  border-radius:18px;
  padding:16px 16px 20px;
  box-shadow:0 6px 0 rgba(0,0,0,.35);
  animation:up .18s ease;
}
@keyframes up{from{transform:translateY(24px) scale(.97);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#c9c2ab;margin:0 auto 12px}
.dhead{display:flex;gap:12px;align-items:flex-start}
.dart{
  flex:0 0 64px;height:88px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
.dtitle{font-size:19px;font-weight:900;line-height:1.1}
.badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{
  font-size:10.5px;font-weight:900;padding:3px 9px;border-radius:6px;color:#fff;
  border:2px solid rgba(0,0,0,.3);box-shadow:0 2px 0 rgba(0,0,0,.25);
  text-transform:uppercase;letter-spacing:.5px;
}
.b-cost{background:var(--gold);color:#211a05}
.effectbox{
  margin-top:14px;background:#fffdf4;border:2.5px dashed #b9b094;border-radius:10px;
  padding:10px 12px;font-size:14.5px;font-weight:700;line-height:1.45;
}
.effectbox .lbl, .secthead{
  font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:#8d8568;
  display:block;margin-bottom:4px;
}
.notes{margin-top:12px;font-size:13.5px;line-height:1.5;color:#4c4838}
.syntags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.syntag{
  font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;
  background:#e8e1cb;border:2px solid #b9b094;color:#5a5440;
}
.relrow{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.relcard{
  flex:0 0 auto;font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:8px;
  background:#fffdf4;border:2px solid #b9b094;color:#3c3828;box-shadow:0 2px 0 rgba(0,0,0,.15);
}
/* ---------- synergies ---------- */
.synblock{
  background:var(--card);color:var(--ink);border:3px solid var(--card-edge);
  border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.45);
  padding:12px 14px;margin-bottom:12px;
}
.synblock h3{font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.synblock .tier{
  font-size:9.5px;font-weight:900;padding:2px 8px;border-radius:5px;color:#fff;
  background:var(--mult);border:2px solid rgba(0,0,0,.3);letter-spacing:.5px;
}
.synblock .pieces{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
.piece{
  font-size:11px;font-weight:800;padding:4px 10px;border-radius:7px;color:#fff;
  border:2px solid rgba(0,0,0,.3);box-shadow:0 2px 0 rgba(0,0,0,.2);cursor:pointer;
}
.synblock p{font-size:13px;line-height:1.5;color:#4c4838}
/* ---------- quiz ---------- */
.qwrap{padding:4px 2px}
.qmodes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qmode{
  background:var(--card);color:var(--ink);border:3px solid var(--card-edge);
  border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.45);padding:14px 12px;cursor:pointer;
}
.qmode:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.qmode .qi{font-size:24px}
.qmode .qt{font-size:13.5px;font-weight:900;margin-top:6px}
.qmode .qd{font-size:11px;color:#6b6450;font-weight:600;margin-top:2px;line-height:1.35}
.scorebar{
  display:flex;gap:10px;margin-bottom:14px;
}
.scorebox{
  flex:1;text-align:center;background:#0f241b;border:3px solid var(--card-edge);
  border-radius:12px;padding:8px 4px;box-shadow:0 3px 0 rgba(0,0,0,.4);
}
.scorebox .v{font-size:20px;font-weight:900}
.scorebox .l{font-size:9.5px;font-weight:800;letter-spacing:1px;color:var(--text-dim)}
.v.chips{color:var(--chip)} .v.mult{color:var(--mult)} .v.goldv{color:var(--gold)}
.qcard{
  background:var(--card);color:var(--ink);border:3px solid var(--card-edge);
  border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.45);padding:16px 14px;
}
.qprompt{font-size:15.5px;font-weight:800;line-height:1.45}
.qprompt .em{color:#9b7b16}
.qopts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.qopt{
  text-align:left;font:inherit;font-size:13.5px;font-weight:700;line-height:1.35;
  background:#fffdf4;border:2.5px solid #b9b094;border-radius:10px;
  padding:11px 12px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);color:#3c3828;
}
.qopt:disabled{opacity:.92}
.qopt.correct{background:#d9f5e6;border-color:#1f8a5e;color:#0d4a30}
.qopt.wrong{background:#ffe1de;border-color:#cc2e22;color:#7a1812}
.qnext{
  margin-top:14px;width:100%;height:46px;border-radius:11px;font-size:15px;font-weight:900;
  background:var(--gold);color:#211a05;border:3px solid #7a5c12;
  box-shadow:0 4px 0 rgba(0,0,0,.35);cursor:pointer;font-family:inherit;
}
.qnext:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.qfeedback{margin-top:10px;font-size:13px;font-weight:800;min-height:18px}
.qfeedback.ok{color:#1f8a5e}.qfeedback.no{color:#cc2e22}
.qresult{text-align:center;padding:10px 0}
.qresult .big{font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.5)}
.qresult .sub{font-size:13px;color:#4c4838;font-weight:700;margin-top:4px}
.qback{background:none;border:none;color:var(--text-dim);font-weight:800;font-size:12px;
  margin-bottom:10px;cursor:pointer;font-family:inherit;padding:4px 0}
/* ---------- tutorial ---------- */
.tutwrap{max-width:640px;margin:0 auto}
.tutbar{margin:2px 2px 12px}
.tutprog{height:7px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:9px}
.tutprog>i{display:block;height:100%;background:var(--gold);border-radius:5px;transition:width .25s ease}
.tutdots{display:flex;gap:5px;flex-wrap:wrap}
.tutdot{min-width:24px;height:24px;border-radius:7px;border:2px solid rgba(0,0,0,.3);
  background:#0f241b;color:var(--text-dim);font-size:11px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0 6px;transition:background .15s,color .15s}
.tutdot.on{background:var(--gold);color:#211a05;border-color:#8a6a14}
.tutdot.done{color:#7fd3a3;border-color:#2f6a4e}
.tutcard{background:var(--card);color:var(--ink);border:3px solid var(--card-edge);border-radius:16px;
  box-shadow:0 5px 0 rgba(0,0,0,.35);padding:18px 18px 20px}
.tutcard h2{font-size:21px;font-weight:900;color:#3a2f12;margin-bottom:2px}
.tutstep{font-size:11px;font-weight:800;color:#8a7d52;letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px}
.tutcard p{font-size:14px;line-height:1.5;color:#403a2a;margin:9px 0}
.tutcard b{color:#1a1a1a}
.tutcard ul{margin:8px 0 8px 2px;list-style:none;display:flex;flex-direction:column;gap:7px}
.tutcard li{font-size:13.5px;line-height:1.45;color:#403a2a;padding-left:22px;position:relative}
.tutcard li:before{content:"♠";position:absolute;left:0;top:0;color:var(--mult);font-weight:900}
.tutcard .em{font-weight:900;color:var(--mult)}
.tlink{display:inline-block;margin:6px 6px 0 0;padding:7px 12px;border-radius:9px;border:2px solid #b9b094;
  background:#efe8d2;color:#3a2f12;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit}
.tlink:hover{background:var(--gold);border-color:#8a6a14}
.tutnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.tutbtn{flex:1;height:46px;border-radius:12px;font-size:15px;font-weight:900;font-family:inherit;cursor:pointer;
  border:3px solid #7a5c12;background:var(--gold);color:#211a05;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.tutbtn.sec{background:#e8e1cb;border-color:#b9b094;color:#4c4838}
.tutbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tutbtn:disabled{opacity:.4;cursor:default}
/* scoring playground */
.sdemo{background:#fffdf5;border:2px dashed #c7bd99;border-radius:13px;padding:13px;margin:14px 0 4px}
.sdlbl{font-weight:800;font-size:12px;color:#6b6450;margin:2px 0 5px}
.sdrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sdchip{padding:6px 10px;border-radius:8px;border:2px solid rgba(0,0,0,.25);background:#eee6cf;
  font-size:12px;font-weight:800;color:#3a3320;cursor:pointer;transition:background .12s,color .12s}
.sdchip.on{background:var(--chip);color:#fff;border-color:#06557f}
.sdchip.sdjok.on{background:var(--mult);color:#fff;border-color:#a3261f}
.sdscore{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;flex-wrap:wrap}
.sdscore .pill{padding:8px 14px;border-radius:9px;font-size:17px;font-weight:900;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.sdscore .chips{background:var(--chip)}
.sdscore .mult{background:var(--mult)}
.sdscore .x{font-size:18px;color:#6b6450;font-weight:900}
.sdtotal{text-align:center;margin-top:12px;font-size:13px;font-weight:800;color:#6b6450;letter-spacing:.5px}
.sdtotal b{display:block;font-size:30px;color:#a8791e;text-shadow:0 2px 0 rgba(0,0,0,.18);margin-top:2px}
/* ---------- play (mini game) ---------- */
.pgwrap{max-width:680px;margin:0 auto}
.pblind{text-align:center;font-weight:900;font-size:16px;color:var(--gold);margin-bottom:8px;text-shadow:0 2px 0 #000}
.phud{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 12px}
.pstat{background:#0f241b;border:2px solid rgba(0,0,0,.35);border-radius:9px;padding:6px 9px;font-size:10px;font-weight:800;color:var(--text-dim);text-align:center;min-width:56px;letter-spacing:.4px}
.pstat b{display:block;font-size:14px;color:#fff;margin-top:2px;letter-spacing:0}
.pstat.tgt b{color:var(--mult)} .pstat.scr b{color:var(--gold)} .pstat.cash b{color:#7fd3a3}
.pjokers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:10px;margin-bottom:12px}
.pjok{background:var(--card);color:var(--ink);border:2px solid var(--card-edge);border-radius:9px;padding:6px;font-size:10.5px;font-weight:800;width:78px;cursor:default;position:relative;text-align:center}
.pjok .pjnm{margin-top:3px;line-height:1.15}
.pjok small{display:block;font-weight:600;color:#6b6450;font-size:9px;line-height:1.18;margin-top:1px}
.pjok .sell{display:block;margin-top:4px;color:#a3261f;font-weight:800;font-size:10px}
.pjart{aspect-ratio:71/95;width:100%;border-radius:6px;position:relative;overflow:hidden}
.pjart img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;border-radius:inherit}
.pjart .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;border-radius:inherit;color:#fff;font-weight:900;font-size:13px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.pjart.noimg .ph{display:flex}
.pbuy .pjart{width:62px;margin:0 auto 7px}
.psort{display:flex;gap:8px;justify-content:center;margin-bottom:8px}

.pcard.sel{transform:translateY(-14px);box-shadow:0 9px 0 rgba(242,193,78,.55),0 3px 0 rgba(0,0,0,.4);border-color:var(--gold)}
.pcard .pr{position:absolute;top:3px;left:5px;font-size:13px;font-weight:900;line-height:1}
.pcard .ps{position:absolute;bottom:3px;right:5px;font-size:22px;line-height:1}
.pcard.red{color:#d4302a} .pcard.blk{color:#1a1a1a}
.ppreview{text-align:center;font-weight:800;font-size:13px;color:var(--text-dim);min-height:18px;margin-bottom:8px}
.ppreview b{color:#fff}
.pacts{display:flex;gap:10px;max-width:420px;margin:0 auto}
.pbtn{flex:1;height:46px;border-radius:12px;font-size:14px;font-weight:900;font-family:inherit;cursor:pointer;border:3px solid #7a5c12;background:var(--gold);color:#211a05;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.pbtn.disc{background:var(--mult);border-color:#a3261f;color:#fff}
.pbtn.sec{background:#0f241b;border-color:#0b1d15;color:var(--text-dim)}
.pbtn:disabled{opacity:.4;cursor:default;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.pbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.pshop,.pover{max-width:560px;margin:0 auto;background:var(--card);color:var(--ink);border:3px solid var(--card-edge);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.35);padding:18px}
.pshop h2,.pover h2{font-size:21px;font-weight:900;color:#3a2f12;text-align:center;margin-bottom:4px}
.pshop .sub{text-align:center;font-size:12px;color:#6b6450;font-weight:700;margin-bottom:14px;line-height:1.5}
.pshop .sub b{color:#a8791e}
.pshelf{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}
.pbuy{width:144px;background:#fffdf5;border:2px solid #c7bd99;border-radius:11px;padding:10px;text-align:center;cursor:pointer}
.pbuy .nm{font-weight:900;font-size:13px;color:#2f2710}
.pbuy .ds{font-size:11px;color:#6b6450;font-weight:600;margin:5px 0;min-height:30px;line-height:1.3}
.pbuy .pr{font-weight:900;color:#a8791e;font-size:14px}
.pbuy:hover{border-color:var(--gold)}
.pbuy.cant{opacity:.45;cursor:default}
.pshop .lbl{font-weight:800;font-size:12px;color:#6b6450;margin:12px 0 6px}
.pshop .row{display:flex;gap:10px;justify-content:center;margin-top:16px}
.pover{text-align:center}
.pover .big{font-size:30px;font-weight:900;margin:8px 0}
.pover .win{color:#1f8a5e}.pover .lose{color:#cc2e22}
.pover p{font-size:13px;color:#6b6450;font-weight:700}
.pcard.scoring{outline:3px solid #35bd86;outline-offset:1px}
.pcard .sc{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#35bd86;color:#06351f;font-size:9px;font-weight:900;padding:1px 5px;border-radius:6px;border:1.5px solid #06351f}
.pcard .enb{position:absolute;top:2px;right:2px;background:#2b2b2b;color:#fff;font-size:7.5px;font-weight:900;padding:1px 3px;border-radius:4px;line-height:1.1}

.pcard.ed-holo{box-shadow:0 0 0 2px #ff7fc4,0 3px 0 rgba(0,0,0,.4)}
.pcard.ed-poly{box-shadow:0 0 0 2px #f2c14e,0 3px 0 rgba(0,0,0,.4)}

.pcon .pjnm{margin-top:3px;line-height:1.13}
.pcon small{display:block;font-weight:600;color:#6b6450;font-size:9px;line-height:1.18;margin-top:1px}
.pcon .use{display:block;margin-top:4px;color:#2f8a5e;font-weight:800;font-size:9px}

.pselrow .pbtn{flex:1 1 200px;height:auto;min-height:60px;padding:11px 10px;line-height:1.35}
.pselrow .pbtn small{display:block;font-weight:700;font-size:11px;opacity:.85;margin-top:3px}
.pbtn.skip{background:#7ec8ff;border-color:#3f7fc4;color:#0e2238}
.pbosswarn{max-width:480px;margin:12px auto 0;text-align:center;font-size:12px;font-weight:700;color:var(--text-dim)}
.ptagmsg{max-width:480px;margin:14px auto 0;background:#0f241b;border:2px solid #2f6a4e;border-radius:10px;padding:9px 12px;color:#9fe0bd;font-size:12px;font-weight:700;text-align:center}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:space-around;align-items:stretch;
  background:#0f241b;border-top:3px solid #0b1d15;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav button{
  flex:1;background:none;border:none;color:#7fa18d;font-family:inherit;
  font-size:10px;font-weight:800;letter-spacing:.4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;
}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--gold)}
.hidden{display:none!important}
.empty{
  text-align:center;padding:40px 20px;color:var(--text-dim);font-weight:700;font-size:13.5px;line-height:1.5;
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

const TINT={Common:'t-common',Uncommon:'t-uncommon',Rare:'t-rare',Legendary:'t-legendary',Tarot:'t-tarot',Planet:'t-planet',Spectral:'t-spectral',Deck:'t-deck',Tag:'t-tag',Seal:'t-seal',Stake:'t-stake',Sticker:'t-sticker',Enhancement:'t-enh',Voucher:'t-voucher',Blind:'t-blind',Booster:'t-pack'};

let typeF='All', rarityF='All', q='';

const TYPES=['All','Joker','Tarot','Planet','Spectral','Tag','Seal','Stake','Sticker','Enhancement','Voucher','Blind','Booster'];
const RARITIES=['All','Common','Uncommon','Rare','Legendary'];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function initial(c){
  const w=c.name.replace(/^The /,'').split(' ');
  return w.length>1?(w[0][0]+w[1][0]).toUpperCase():w[0].slice(0,2).toUpperCase();
}
function artHTML(c,cls){
  let inner;
  if(c.type==='Planet'){
    inner='<div class="planetball'+(c.id==='saturn'?' ring':'')+'" style="--pc:'+PLANET_COLOR[c.id]+'"></div>';
  } else {
    const g=GLYPH[c.id];
    inner=g?'<span class="gl">'+g+'</span>':initial(c);
  }
  // explicit img field wins; otherwise auto-look for art/<id>.<ext>, falling back to the glyph
  const src=c.img||(ART_DIR+'/'+c.id+'.'+ART_EXT);
  // placeholder (tint box + glyph) is hidden by default; it is only revealed if the image fails to load
  const ph='<div class="ph '+TINT[c.rarity]+'">'+inner+'</div>';
  const img='<img src="'+src+'" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\');this.remove()">';
  return '<div class="'+cls+'">'+ph+img+'</div>';
}

function renderChips(){
  const tc=document.getElementById('typechips');
  tc.innerHTML=TYPES.map(t=>'<div class="fchip'+(typeF===t?' on':'')+'" onclick="setType(\''+t+'\')">'+t+(t==='All'?'':'s')+'</div>').join('');
  const rc=document.getElementById('raritychips');
  if(typeF==='Joker'||typeF==='All'){
    rc.style.display='flex';
    rc.innerHTML=RARITIES.map(r=>'<div class="fchip r-'+r.toLowerCase()+(rarityF===r?' on':'')+'" onclick="setRarity(\''+r+'\')">'+r+'</div>').join('');

function filtered(){

    if(rarityF!=='All'&&c.type!=='Joker')return false;
    if(q){
      const s=(c.name+' '+c.effect+' '+c.tags.join(' ')).toLowerCase();
      if(!s.includes(q))return false;
    }
    return true;
  });
}

let Q={mode:null,qs:[],i:0,score:0,streak:0,best:0,answered:false};
const MODES=[
 {id:'e2n',qi:'\uD83C\uDFAD',qt:'Name that Joker',qd:'Effect shown \u2014 pick the Joker'},
 {id:'n2e',qi:'\uD83D\uDCDC',qt:'What does it do?',qd:'Joker shown \u2014 pick the effect'},
 {id:'rar',qi:'\uD83C\uDFF7\uFE0F',qt:'Rarity check',qd:'Common, Uncommon, Rare or Legendary?'},

];
function renderQuizHome(){

   '<div class="scorebar">'+

   MODES.map(m=>'<div class="qmode" onclick="startQuiz(\''+m.id+'\')"><div class="qi">'+m.qi+'</div><div class="qt">'+m.qt+'</div><div class="qd">'+m.qd+'</div></div>').join('')+'</div>';
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(arr,n){return shuffle([...arr]).slice(0,n);}
function startQuiz(mode){
  Q.mode=mode;Q.i=0;Q.score=0;Q.streak=0;Q.qs=[];
  if(mode==='pl'){
    Q.qs=pick(PLANETS,Math.min(10,PLANETS.length)).map(p=>{
      const wrong=pick(PLANETS.filter(x=>x.id!==p.id),3).map(x=>x.hand);
      return {prompt:'Which poker hand does <span class="em">'+p.name+'</span> level up?',opts:shuffle([p.hand,...wrong]),ans:p.hand,why:p.name+' levels '+p.hand+'.'};
    });
  } else {
    const pool=pick(JOKERS,10);
    Q.qs=pool.map(j=>{
      if(mode==='e2n'){
        const wrong=pick(JOKERS.filter(x=>x.id!==j.id),3).map(x=>x.name);
        return {prompt:'\u201C'+j.effect+'\u201D<br><br>Which Joker is this?',opts:shuffle([j.name,...wrong]),ans:j.name,why:j.name+' \u2014 '+j.rarity+', $'+j.cost+'.'};
      }
      if(mode==='n2e'){
        const wrong=pick(JOKERS.filter(x=>x.id!==j.id),3).map(x=>x.effect);
        return {prompt:'What does <span class="em">'+j.name+'</span> do?',opts:shuffle([j.effect,...wrong]),ans:j.effect,why:''};
      }
      const opts=['Common','Uncommon','Rare','Legendary'];
      return {prompt:'What rarity is <span class="em">'+j.name+'</span>?<br><span style="font-size:12px;color:#6b6450">\u201C'+j.effect+'\u201D</span>',opts,ans:j.rarity,why:j.name+' is '+j.rarity+'.'};
    });
  }
  renderQ();
}
function renderQ(){
  if(Q.i>=Q.qs.length){
    document.getElementById('qwrap').innerHTML=
    '<button class="qback" onclick="renderQuizHome()">\u2190 Quiz menu</button>'+
    '<div class="qcard"><div class="qresult"><div class="big">'+Q.score+' / '+Q.qs.length+'</div>'+
    '<div class="sub">'+(Q.score===Q.qs.length?'Flush Five. Perfect round.':Q.score>=7?'Boss Blind beaten.':Q.score>=4?'Small Blind cleared \u2014 keep grinding.':'Back to the collection with you.')+'</div></div>'+
    '<button class="qnext" onclick="startQuiz(\''+Q.mode+'\')">Play again</button>'+
    '<button class="qnext" style="margin-top:8px;background:#e8e1cb;border-color:#b9b094" onclick="renderQuizHome()">Change mode</button></div>';
    return;
  }
  Q.answered=false;
  const cq=Q.qs[Q.i];
  document.getElementById('qwrap').innerHTML=
  '<button class="qback" onclick="renderQuizHome()">\u2190 Quiz menu</button>'+
  '<div class="scorebar">'+
  '<div class="scorebox"><div class="v chips">'+(Q.i+1)+'/'+Q.qs.length+'</div><div class="l">QUESTION</div></div>'+
  '<div class="scorebox"><div class="v goldv">'+Q.score+'</div><div class="l">SCORE</div></div>'+
  '<div class="scorebox"><div class="v mult">\u00d7'+Q.streak+'</div><div class="l">STREAK</div></div>'+
  '</div><div class="qcard"><div class="qprompt">'+cq.prompt+'</div>'+
  '<div class="qopts">'+cq.opts.map((o,k)=>'<button class="qopt" id="opt'+k+'" onclick="answer('+k+')">'+esc(o)+'</button>').join('')+'</div>'+
  '<div class="qfeedback" id="qfb"></div></div>';
}
function answer(k){
  if(Q.answered)return; Q.answered=true;
  const cq=Q.qs[Q.i];
  const right=cq.opts[k]===cq.ans;
  cq.opts.forEach((o,j)=>{
    const el=document.getElementById('opt'+j); el.disabled=true;
    if(o===cq.ans)el.classList.add('correct');
    else if(j===k)el.classList.add('wrong');
  });
  const fb=document.getElementById('qfb');
  if(right){Q.score++;Q.streak++;if(Q.streak>Q.best)Q.best=Q.streak;
    fb.textContent='\u2713 Correct! '+(cq.why||''); fb.className='qfeedback ok';}
  else {Q.streak=0; fb.textContent='\u2717 '+(cq.why||('Answer: '+cq.ans)); fb.className='qfeedback no';}
  const btn=document.createElement('button');btn.className='qnext';btn.textContent=Q.i+1>=Q.qs.length?'See results':'Next';
  btn.onclick=()=>{Q.i++;renderQ();};
  document.querySelector('.qcard').appendChild(btn);
}

function pgEval(cs){
  const stones=cs.filter(c=>c.enh==='stone');
  const real=cs.filter(c=>c.enh!=='stone');
  const n=real.length;
  const byRank={}; real.forEach(c=>{(byRank[c.rank]=byRank[c.rank]||[]).push(c);});
  const groups=Object.values(byRank).sort((a,b)=>b.length-a.length||b[0].rv-a[0].rv);
  const counts=groups.map(g=>g.length);
  let isFlush=false;
  if(n===5){const ns=real.filter(c=>c.enh!=='wild');isFlush=ns.length===0||ns.every(c=>c.suit===ns[0].suit);}
  let isStraight=false;
  if(n===5){const rvs=[...new Set(real.map(c=>c.rv))].sort((a,b)=>a-b);if(rvs.length===5&&(rvs[4]-rvs[0]===4||rvs.join(',')==='2,3,4,5,14'))isStraight=true;}
  const mk=(type,scoring)=>({type,scoring:scoring.concat(stones)});
  if(isStraight&&isFlush) return mk('Straight Flush',real);
  if(counts[0]===4) return mk('Four of a Kind',groups[0]);
  if(counts[0]===3&&counts[1]===2) return mk('Full House',real);
  if(isFlush) return mk('Flush',real);
  if(isStraight) return mk('Straight',real);
  if(counts[0]===3) return mk('Three of a Kind',groups[0]);
  if(counts[0]===2&&counts[1]===2) return mk('Two Pair',groups[0].concat(groups[1]));
  if(counts[0]===2) return mk('Pair',groups[0]);
  if(!real.length) return mk('High Card',[]);
  return mk('High Card',[real.slice().sort((a,b)=>b.rv-a.rv)[0]]);
}
function pgScore(cs,resolve){
  const e=pgEval(cs); let [chips,mult]=HV[e.type];
  const lv=(PLAY.handLvl&&PLAY.handLvl[e.type])||0; chips+=lv*10; mult+=lv;
  let xmult=1, money=0;
  e.scoring.forEach(c=>{
    const trig=(c.seal==='red')?2:1;
    for(let t=0;t<trig;t++){
      chips+=pgCardChips(c);
      if(c.enh==='mult')mult+=4;
      if(c.ed==='holo')mult+=10;
      if(c.enh==='glass')xmult*=2;
      if(c.ed==='poly')xmult*=1.5;
      if(resolve){
        if(c.seal==='gold')money+=3;
        if(c.enh==='gold')money+=3;
        if(c.enh==='lucky'){if(Math.random()<0.2)mult+=20;if(Math.random()<1/15)money+=20;}
      }
    }
  });
  const held=(PLAY.hand||[]).filter(h=>cs.indexOf(h)<0);
  held.forEach(h=>{if(h.enh==='steel')xmult*=1.5;});
  PLAY.jokers.forEach(j=>{const r=j.f({scoring:e.scoring,played:cs,type:e.type})||{}; chips+=r.c||0; mult+=r.m||0; if(r.x)xmult*=r.x;});
  mult*=xmult;
  return {type:e.type,chips,mult:Math.round(mult*100)/100,total:Math.round(chips*mult),money};
}
function pgFmtM(m){return Number.isInteger(m)?m:Math.round(m*10)/10;}

let PLAY={phase:'menu'};
function pgStart(){PLAY={phase:'select',ante:0,blind:0,money:4,jokers:[],hand:[],sel:new Set(),deck:[],deck52:pgNewDeck(),consumables:[],conCap:2,pack:null,score:0,hands:4,discards:3,shop:[],rerollCost:5,sortMode:'rank',msg:'',lastReward:null,jokerCap:5,handSize:8,curHandSize:8,handLvl:{},skips:0,handsPlayed:0,unusedDiscards:0,freeShop:false,freeReroll:false,doubleNext:false,extraHandNext:0,skipTag:null,tagMsg:'',showOdds:false};pgStartBlind();}
function pgRollTag(){return TAGS[Math.floor(Math.random()*TAGS.length)].id;}
function pgStartBlind(){const bd=BLINDDEF[PLAY.blind];PLAY.target=Math.round(ANTE_BASE[PLAY.ante]*bd.mult);PLAY.curHandSize=PLAY.handSize+PLAY.extraHandNext;PLAY.extraHandNext=0;PLAY.skipTag=PLAY.blind<2?pgRollTag():null;PLAY.showOdds=false;PLAY.phase='select';pgRender();}
function pgBeginBlind(){PLAY.score=0;PLAY.hands=4;PLAY.discards=3;PLAY.sel=new Set();PLAY.deck=pgShuffle(PLAY.deck52.slice());PLAY.hand=[];PLAY.msg='';PLAY.tagMsg='';PLAY.phase='play';pgDraw();pgRender();}
function pgToggleOdds(){PLAY.showOdds=!PLAY.showOdds;pgRender();}
function pgGrantJoker(){if(PLAY.jokers.length<PLAY.jokerCap){const owned=new Set(PLAY.jokers.map(j=>j.id));const pool=GJOKERS.filter(j=>!owned.has(j.id));if(pool.length){PLAY.jokers.push(pool[Math.floor(Math.random()*pool.length)]);return true;}}return false;}
function pgLevelHand(h,n){PLAY.handLvl[h]=(PLAY.handLvl[h]||0)+n;}
function pgRandHand(){const ks=Object.keys(HV);return ks[Math.floor(Math.random()*ks.length)];}
const TAG_FX={
 tg_uncommon:()=>{if(pgGrantJoker())return'Gained a free Joker.';PLAY.money+=4;return'Slots full → +$4.';},
 tg_rare:()=>{if(pgGrantJoker())return'Gained a free Joker.';PLAY.money+=6;return'Slots full → +$6.';},
 tg_negative:()=>{PLAY.jokerCap++;const g=pgGrantJoker();return'Joker slots +1'+(g?' and a free Joker.':'.');},
 tg_foil:()=>{PLAY.money+=5;return'Editions aren’t simulated → +$5.';},
 tg_holographic:()=>{PLAY.money+=5;return'Editions aren’t simulated → +$5.';},
 tg_polychrome:()=>{PLAY.money+=5;return'Editions aren’t simulated → +$5.';},
 tg_investment:()=>{PLAY.money+=25;return'+$25.';},
 tg_voucher:()=>{PLAY.money+=10;return'Vouchers aren’t simulated → +$10.';},
 tg_boss:()=>{return'Boss reroll (no boss effects in this mini-game).';},
 tg_standard:()=>{PLAY.money+=6;return'Standard Pack not simulated → +$6.';},
 tg_charm:()=>{PLAY.money+=6;return'Arcana Pack not simulated → +$6.';},
 tg_meteor:()=>{const h=pgRandHand();pgLevelHand(h,1);return'Leveled '+h+' +1.';},
 tg_buffoon:()=>{const a=pgGrantJoker(),b=pgGrantJoker();if(a||b)return'Free Joker(s) from a Buffoon Pack.';PLAY.money+=6;return'Slots full → +$6.';},
 tg_handy:()=>{const m=PLAY.handsPlayed;PLAY.money+=m;return'+$'+m+' ($1 per hand played).';},
 tg_garbage:()=>{const m=PLAY.unusedDiscards;PLAY.money+=m;return'+$'+m+' ($1 per unused discard).';},
 tg_ethereal:()=>{PLAY.money+=6;return'Spectral Pack not simulated → +$6.';},
 tg_coupon:()=>{PLAY.freeShop=true;return'Next shop: all items free!';},
 tg_double:()=>{PLAY.doubleNext=true;return'Your next Tag triggers twice.';},
 tg_juggle:()=>{PLAY.extraHandNext+=3;return'+3 hand size next round.';},
 tg_d6:()=>{PLAY.freeReroll=true;return'Next shop: rerolls are free.';},
 tg_topup:()=>{const a=pgGrantJoker(),b=pgGrantJoker();return(a||b)?'Gained Joker(s).':'Joker slots full.';},
 tg_speed:()=>{const m=5*PLAY.skips;PLAY.money+=m;return'+$'+m+' ($5 per blind skipped).';},
 tg_orbital:()=>{const h=pgRandHand();pgLevelHand(h,3);return'Leveled '+h+' +3.';},
 tg_economy:()=>{const g=Math.min(40,Math.max(0,PLAY.money));PLAY.money+=g;return'Doubled money → +$'+g+'.';}
};
function pgApplyTag(id){const fx=TAG_FX[id];return fx?fx():'No effect.';}
function pgSkip(){const id=PLAY.skipTag;if(!id)return;PLAY.skips++;const wasDouble=PLAY.doubleNext;PLAY.doubleNext=false;let note=pgApplyTag(id);if(wasDouble&&id!=='tg_double')note+=' ×2 → '+pgApplyTag(id);PLAY.tagMsg=(byId[id]?byId[id].name:id)+' — '+note;pgGotoNext();}
function pgGotoNext(){PLAY.blind++;if(PLAY.blind>2){PLAY.blind=0;PLAY.ante++;}if(PLAY.ante>=ANTE_BASE.length){PLAY.phase='win';pgRender();return;}pgStartBlind();}
function pgDraw(){const hs=PLAY.curHandSize||8;while(PLAY.hand.length<hs&&PLAY.deck.length)PLAY.hand.push(PLAY.deck.pop());pgSort();}
function pgSort(){const f=PLAY.sortMode;PLAY.hand.sort((a,b)=>f==='suit'?(PG_SUITS.indexOf(a.suit)-PG_SUITS.indexOf(b.suit)||b.rv-a.rv):(b.rv-a.rv||PG_SUITS.indexOf(a.suit)-PG_SUITS.indexOf(b.suit)));}
function pgSortMode(m){PLAY.sortMode=m;pgSort();pgRender();}
function pgSelect(uid){if(PLAY.sel.has(uid))PLAY.sel.delete(uid);else{if(PLAY.sel.size>=5)return;PLAY.sel.add(uid);}PLAY.msg='';pgRender();}
function pgSelected(){return PLAY.hand.filter(c=>PLAY.sel.has(c.uid));}
function pgPlay(){const cs=pgSelected();if(cs.length<1||cs.length>5)return;const r=pgScore(cs,true);PLAY.score+=r.total;if(r.money)PLAY.money+=r.money;PLAY.handsPlayed++;PLAY.hand=PLAY.hand.filter(c=>!PLAY.sel.has(c.uid));PLAY.sel=new Set();PLAY.hands--;PLAY.msg=r.type+': '+r.chips+' × '+pgFmtM(r.mult)+' = '+r.total.toLocaleString()+(r.money?' (+$'+r.money+')':'');if(PLAY.score>=PLAY.target){pgWinBlind();return;}if(PLAY.hands<=0){PLAY.phase='over';pgRender();return;}pgDraw();pgRender();}
function pgDiscard(){if(PLAY.discards<=0)return;const cs=pgSelected();if(cs.length<1||cs.length>5)return;cs.forEach(c=>{if(c.seal==='purple')pgAddCons(()=>pgRandFrom(PG_TAROTS),1);});PLAY.hand=PLAY.hand.filter(c=>!PLAY.sel.has(c.uid));PLAY.sel=new Set();PLAY.discards--;pgDraw();pgRender();}
function pgWinBlind(){const bd=BLINDDEF[PLAY.blind];(PLAY.hand||[]).forEach(c=>{if(c.seal==='blue')pgAddCons(()=>pgRandFrom(PG_PLANETS),1);});PLAY.unusedDiscards+=PLAY.discards;const interest=Math.min(5,Math.floor(PLAY.money/5));PLAY.lastReward={base:bd.reward,hands:PLAY.hands,interest};PLAY.money+=bd.reward+PLAY.hands+interest;if(PLAY.ante===ANTE_BASE.length-1&&PLAY.blind===2){PLAY.phase='win';pgRender();return;}PLAY.phase='shop';pgRollShop();pgRender();}
function pgRollShop(){const owned=new Set(PLAY.jokers.map(j=>j.id));const pool=GJOKERS.filter(j=>!owned.has(j.id));PLAY.shop=pgShuffle(pool.slice()).slice(0,2);PLAY.shopPacks=pgShuffle(PG_PACKS.slice()).slice(0,2);}
function pgBuy(id){const j=PLAY.shop.find(x=>x.id===id);if(!j)return;const cost=PLAY.freeShop?0:j.cost;if(PLAY.money<cost||PLAY.jokers.length>=PLAY.jokerCap)return;PLAY.money-=cost;PLAY.jokers.push(j);PLAY.shop=PLAY.shop.filter(x=>x.id!==id);pgRender();}
function pgSell(i){const j=PLAY.jokers[i];if(!j)return;PLAY.money+=Math.max(1,Math.floor(j.cost/2));PLAY.jokers.splice(i,1);pgRender();}
function pgReroll(){const c=PLAY.freeReroll?0:PLAY.rerollCost;if(PLAY.money<c)return;PLAY.money-=c;pgRollShop();pgRender();}
function pgNext(){PLAY.freeShop=false;PLAY.freeReroll=false;pgGotoNext();}

function pgRender(){
  const v=document.getElementById('view-play');
  if(PLAY.phase==='menu'){v.innerHTML='<div class="pgwrap"><div class="pover"><h2>🎴 Balatro — Mini Run</h2><p>Beat all 8 Antes. Play poker hands from a standard 52-card deck to reach each Blind’s target. Win cash, buy Jokers, and scale Chips × Mult.</p><button class="pbtn" style="max-width:240px;margin:16px auto 0" onclick="pgStart()">Start Run →</button><div style="margin-top:10px"><span class="tlink" onclick="go(\'tut\')">New to Balatro? Learn first →</span></div></div></div>';return;}
  if(PLAY.phase==='over'||PLAY.phase==='win'){const win=PLAY.phase==='win';v.innerHTML='<div class="pgwrap"><div class="pover"><h2>'+(win?'🏆 You Win!':'💀 Game Over')+'</h2><div class="big '+(win?'win':'lose')+'">'+(win?'Ante 8 cleared':'Ante '+(PLAY.ante+1)+' · '+BLINDDEF[PLAY.blind].name)+'</div><p>'+(win?'You beat the whole run. Legendary.':'Ran out of hands before reaching the target ('+PLAY.score.toLocaleString()+' / '+PLAY.target.toLocaleString()+').')+'</p><button class="pbtn" style="max-width:240px;margin:16px auto 0" onclick="pgStart()">Play Again →</button></div></div>';return;}
  if(PLAY.phase==='select'){
    const bd=BLINDDEF[PLAY.blind];const tag=PLAY.skipTag?byId[PLAY.skipTag]:null;const prob=(100/TAGS.length).toFixed(1);
    let body='<div class="pblind">Ante '+(PLAY.ante+1)+'/8 · '+bd.name+'</div>'+
      '<div class="phud"><div class="pstat tgt">TARGET<b>'+PLAY.target.toLocaleString()+'</b></div><div class="pstat">REWARD<b>$'+bd.reward+'</b></div><div class="pstat cash">CASH<b>$'+PLAY.money+'</b></div></div>';
    if(PLAY.tagMsg)body+='<div class="ptagmsg">🏷️ '+esc(PLAY.tagMsg)+'</div>';
    if(PLAY.skipTag){
      body+='<div class="pselrow">'+
        '<button class="pbtn" onclick="pgBeginBlind()">▶ Play Round<small>Hit '+PLAY.target.toLocaleString()+' for $'+bd.reward+' + bonuses</small></button>'+
        '<button class="pbtn skip" onclick="pgSkip()">⏭ Skip for Tag<small>'+(GLYPH[PLAY.skipTag]||'🏷️')+' '+esc(tag?tag.name:'')+' · '+prob+'%</small></button>'+
      '</div>'+
      (tag?'<div class="pbosswarn">Tag effect: '+esc(tag.effect)+'</div>':'')+
      '<div class="podds"><span class="tog" onclick="pgToggleOdds()">'+(PLAY.showOdds?'▴ Hide tag odds':'▾ Show all tag odds')+'</span>'+
        (PLAY.showOdds?'<div class="oddsgrid">'+TAGS.map(t=>'<div class="ocell'+(t.id===PLAY.skipTag?' hot':'')+'">'+(GLYPH[t.id]||'')+' '+esc(t.name.replace(/ Tag$/,''))+' <b>'+prob+'%</b></div>').join('')+'</div><div style="font-size:11px;color:var(--text-dim);margin-top:8px">Every tag is equally likely: 1 of '+TAGS.length+' = '+prob+'% each.</div>':'')+
      '</div>';
    } else {
      body+='<div class="pselrow"><button class="pbtn" onclick="pgBeginBlind()">▶ Play Boss Blind<small>Hit '+PLAY.target.toLocaleString()+' for $'+bd.reward+'</small></button></div><div class="pbosswarn">Boss Blinds can’t be skipped.</div>';
    }
    v.innerHTML='<div class="pgwrap">'+body+'</div>';return;
  }
  if(PLAY.phase==='shop'){
    const r=PLAY.lastReward||{base:0,hands:0,interest:0};const free=PLAY.freeShop;
    const shelf=PLAY.shop.length?PLAY.shop.map(j=>{const cost=free?0:j.cost;const can=PLAY.money>=cost&&PLAY.jokers.length<PLAY.jokerCap;return '<div class="pbuy '+(can?'':'cant')+'"'+(can?' onclick="pgBuy(\''+j.id+'\')"':'')+'>'+pgJokerArt(j)+'<div class="nm">'+esc(j.name)+'</div><div class="ds">'+esc(j.desc)+'</div><div class="pr">'+(free?'FREE':'$'+j.cost)+'</div></div>';}).join(''):'<div style="color:#6b6450;font-weight:700">Sold out — reroll for more</div>';
    const owned=PLAY.jokers.length?PLAY.jokers.map((j,i)=>'<div class="pjok" onclick="pgSell('+i+')" title="Sell">'+pgJokerArt(j)+'<div class="pjnm">'+esc(j.name)+'</div><small>'+esc(j.desc)+'</small><span class="sell">tap to sell $'+Math.max(1,Math.floor(j.cost/2))+'</span></div>').join(''):'<span style="color:#6b6450;font-size:12px;font-weight:700">No Jokers yet</span>';
    const packs=(PLAY.shopPacks||[]).length?PLAY.shopPacks.map(pk=>{const cost=free?0:pk.cost;const can=PLAY.money>=cost;const card=byId[pk.art]||{id:pk.art,type:'Booster',rarity:'Booster',name:pk.name,img:''};return '<div class="pbuy '+(can?'':'cant')+'"'+(can?' onclick="pgBuyPack(\''+pk.id+'\')"':'')+'>'+artHTML(card,'pjart')+'<div class="nm">'+esc(pk.name)+'</div><div class="ds">Pick '+pk.pick+' of '+pk.size+'</div><div class="pr">'+(free?'FREE':'$'+pk.cost)+'</div></div>';}).join(''):'<div style="color:#6b6450;font-weight:700">Sold out</div>';
    const cons=pgConRow();
    const rc=PLAY.freeReroll?0:PLAY.rerollCost;const flags=[];if(PLAY.freeShop)flags.push('🏷️ items free');if(PLAY.freeReroll)flags.push('🎲 free rerolls');
    v.innerHTML='<div class="pgwrap"><div class="pshop"><h2>🛒 Shop</h2><div class="sub">Cashed out: <b>$'+r.base+'</b> reward + <b>$'+r.hands+'</b> hands left + <b>$'+r.interest+'</b> interest = <b>+$'+(r.base+r.hands+r.interest)+'</b><br>You have <b>$'+PLAY.money+'</b> · Jokers '+PLAY.jokers.length+'/'+PLAY.jokerCap+' · Consumables '+PLAY.consumables.length+'/'+PLAY.conCap+(flags.length?' · '+flags.join(' · '):'')+'</div><div class="lbl">Jokers for sale</div><div class="pshelf">'+shelf+'</div><div class="lbl">Booster packs</div><div class="pshelf">'+packs+'</div><div class="lbl">Your Jokers (tap to sell)</div><div class="pjokers" style="justify-content:flex-start">'+owned+'</div><div class="lbl">Consumables (tap to use)</div><div class="pcons">'+cons+'</div><div class="row"><button class="pbtn sec" onclick="pgReroll()"'+(PLAY.money<rc?' disabled':'')+'>↻ Reroll '+(rc?'$'+rc:'FREE')+'</button><button class="pbtn" onclick="pgNext()">Next Round →</button></div></div></div>';return;
  }
  if(PLAY.phase==='pack'){
    const pk=PLAY.pack;const done=pk.picked>=pk.pick;
    const tiles=pk.items.map((it,i)=>{const taken=it._taken;let inner,nm,ds;
      if(pk.kind==='Card'){inner=pgPlayCardHTML(it,false,false,'');nm=it.rank+it.suit;ds=(it.enh?pgEnhAbbr(it.enh)+' ':'')+(it.ed?it.ed+' ':'')+(it.seal?it.seal+' seal':'');}
      else if(pk.kind==='Joker'){inner=pgJokerArt(it);nm=it.name;ds=it.desc;}
      else{inner=pgConArt(it);nm=it.name;ds=it.desc;}
      return '<div class="pbuy'+(taken?' cant':'')+'"'+((!taken&&!done)?' onclick="pgTakePack('+i+')"':'')+'>'+(pk.kind==='Card'?'<div style="display:flex;justify-content:center;margin-bottom:6px">'+inner+'</div>':inner)+'<div class="nm">'+esc(nm)+'</div><div class="ds">'+esc(ds||'')+'</div><div class="pr">'+(taken?'✓ taken':'take')+'</div></div>';}).join('');
    v.innerHTML='<div class="pgwrap"><div class="pshop"><h2>'+esc(pk.name)+'</h2><div class="sub">Choose <b>'+pk.pick+'</b> of '+pk.items.length+'</div><div class="pshelf">'+tiles+'</div>'+(PLAY.msg?'<div class="ptagmsg">'+esc(PLAY.msg)+'</div>':'')+'<div class="row"><button class="pbtn" onclick="pgClosePack()">'+(done?'Continue →':'Skip pack →')+'</button></div></div></div>';return;
  }
  // play board
  const sel=pgSelected();let preview='Select 1–5 cards to play or discard';let scoreIds=new Set();
  if(sel.length){const e=pgEval(sel);scoreIds=new Set(e.scoring.map(c=>c.uid));const s=pgScore(sel);preview='<b>'+s.type+'</b> · '+s.chips+' × '+pgFmtM(s.mult)+' = <b>'+s.total.toLocaleString()+'</b>';}
  const cards=PLAY.hand.map(c=>{const sd=PLAY.sel.has(c.uid),sc=sd&&scoreIds.has(c.uid);return pgPlayCardHTML(c,sd,sc,'pgSelect('+c.uid+')');}).join('');
  const lvls=Object.keys(PLAY.handLvl).filter(k=>PLAY.handLvl[k]>0).map(k=>k+' +'+PLAY.handLvl[k]);
  const jok=PLAY.jokers.length?PLAY.jokers.map(j=>'<div class="pjok" title="'+esc(j.desc)+'">'+pgJokerArt(j)+'<div class="pjnm">'+esc(j.name)+'</div><small>'+esc(j.desc)+'</small></div>').join(''):'<span style="color:var(--text-dim);font-size:11px;font-weight:700">No Jokers yet — win a round and visit the shop</span>';
  const canPlay=sel.length>=1&&sel.length<=5,canDisc=canPlay&&PLAY.discards>0;
  v.innerHTML='<div class="pgwrap"><div class="pblind">Ante '+(PLAY.ante+1)+'/8 · '+BLINDDEF[PLAY.blind].name+'</div>'+
    '<div class="phud"><div class="pstat tgt">TARGET<b>'+PLAY.target.toLocaleString()+'</b></div><div class="pstat scr">SCORE<b>'+PLAY.score.toLocaleString()+'</b></div><div class="pstat">HANDS<b>'+PLAY.hands+'</b></div><div class="pstat">DISCARDS<b>'+PLAY.discards+'</b></div><div class="pstat cash">CASH<b>$'+PLAY.money+'</b></div></div>'+
    '<div class="pjokers">'+jok+'</div>'+
    '<div class="pcons">'+pgConRow()+'</div>'+
    (lvls.length?'<div class="ppreview" style="color:#7fd3a3;font-size:11px">Hand levels: '+lvls.join(' · ')+'</div>':'')+
    '<div class="psort"><button class="'+(PLAY.sortMode==='rank'?'on':'')+'" onclick="pgSortMode(\'rank\')">Sort: Rank</button><button class="'+(PLAY.sortMode==='suit'?'on':'')+'" onclick="pgSortMode(\'suit\')">Sort: Suit</button></div>'+
    '<div class="phand">'+cards+'</div>'+
    '<div class="ppreview">'+(sel.length?preview:(PLAY.msg?'<span style="color:var(--gold)">Last: '+PLAY.msg+'</span>':preview))+'</div>'+
    '<div class="pacts"><button class="pbtn disc" onclick="pgDiscard()"'+(canDisc?'':' disabled')+'>Discard ('+PLAY.discards+')</button><button class="pbtn" onclick="pgPlay()"'+(canPlay?'':' disabled')+'>Play Hand ('+PLAY.hands+')</button></div></div>';
}

buildTopNav();renderChips();renderGrid();renderSyn();renderDecks();renderQuizHome();renderTut();pgRender();
